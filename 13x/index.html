<!DOCTYPE html>
<html lang="zh-CN" manifest="cache.appcache" data-cache-total="16">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鲁哆啦 Ludora · 主机入口</title>
<script src="../i18n/zh-CN.js"></script>
<script src="../i18n/zh-TW.js"></script>
<script src="../i18n/en-US.js"></script>
<script src="../i18n.js"></script>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="13x.css">
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 6px; }
  #det { font-size:13px; color:#8b95a3; margin:0 0 4px; }
  #det b { color:#c8ced8; font-weight:600; }
  #cache { font-size:12px; color:#5c6672; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }
</style>
</head>
<body class="ludora-custom-brand">
<div id="brand"><span class="brand-mark">L</span><b data-i18n="brand.name">鲁哆啦 Ludora</b><span class="brand-kicker" data-i18n="host.title">主机工具</span></div>
<div id="wrap">
  <div class="eyebrow" data-i18n="host.title">主机工具</div>
  <div id="state" data-i18n="host.loading">正在准备主机入口，请稍候</div>
  <div id="det"></div>
  <div id="cache" data-i18n="cache.installing">正在安装离线缓存：0%</div>
  <div class="cache-progress" aria-label="Cache progress"><span id="cache-progress"></span></div>
  <div class="ad-slot" aria-label="鲁哆啦在线下载"><img src="../store-qr.png" alt="扫码前往鲁哆啦商店"><span>免光盘·免U盘</span><strong>鲁哆啦在线下载</strong><small>联网直接下载安装，即下即玩</small></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    var cacheBar = document.getElementById("cache-progress");
    function setCache(t, ok, progress) {
        cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : "";
        if (typeof progress === "number") cacheBar.style.width = Math.max(0, Math.min(100, progress)) + "%";
    }
    var params = new URLSearchParams(location.search);
    function tr(key, fallback, params) {
        return window.LudoraI18n && window.LudoraI18n.t
            ? window.LudoraI18n.t(key, params)
            : fallback;
    }

    // Firmwares this build has a hardware-measured kernel table for. jb.js
    // still runs its own kernel-table-present gate, so this is UX only.
    // KEEP IN SYNC with ps4_offsets.js and src/lib/jb-host-adapter.ts in
    // ludora-site (nativeHostTarget / isNativeHostPathAllowed): 13.02-13.52.
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 10);
        var ms = minor < 10 ? "0" + minor : String(minor);
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + minor;
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>" : " &middot; not in this build's kernel table");

    if (!supported) { setState(tr("payload.unsupported", "不支持的固件版本"), "bad"); return; }

    var target = "jb.html" + location.search;
    function go() { setState(tr("payload.loading", "正在准备主机入口，请稍候"), "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("离线缓存已就绪", true, 100);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("缓存已就绪", true, 100);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache(tr("cache.complete", "离线缓存安装完成"), true, 100);
        setTimeout(go, 250);
    } else {
        setCache("正在检查离线缓存…");
        ac.addEventListener("downloading",
            function () { setCache(tr("cache.installing", "正在安装离线缓存：0%", { progress: 0 }), false, 0); }, false);
        ac.addEventListener("progress", function (e) {
            var total = e && e.total ? e.total : 16;
            var loaded = e && e.loaded ? e.loaded : 0;
            var progress = Math.round((loaded / total) * 100);
            setCache(tr("cache.installing", "正在安装离线缓存：{progress}%", { progress: progress }), false, progress);
        }, false);

        ac.addEventListener("cached", function () {
            setCache(tr("cache.complete", "离线缓存安装完成"), true, 100);
            setTimeout(go, 250);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache(tr("cache.complete", "离线缓存安装完成"), true, 100);
            setTimeout(go, 250);
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("离线缓存已就绪", true, 100);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("离线缓存暂不可用");
            waitForTap(tr("cache.error", "离线缓存安装失败，请清理浏览器数据后重试"), go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("离线缓存需要更新");
            waitForTap(tr("cache.error", "离线缓存需要更新"), go);
        }, false);
    }
})();
</script>
</body>
</html>
