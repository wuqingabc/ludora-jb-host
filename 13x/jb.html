<!doctype html>
<html lang="zh-CN" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>鲁哆啦 Ludora · 主机入口</title>
    <script src="../i18n/zh-CN.js"></script>
    <script src="../i18n/zh-TW.js"></script>
    <script src="../i18n/en-US.js"></script>
    <script src="../i18n.js"></script>
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* exploit 运行页:品牌/布局走共享 style.css;这里只保留运行态 spinner + 消息。 */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1b2436;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: #7fd0a0;
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #0c1023;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body class="ludora-custom-brand">
    <div id="brand"><span class="brand-mark">L</span><b data-i18n="brand.name">鲁哆啦 Ludora</b><span class="brand-kicker">13.x</span></div>
    <div id="spin"></div>
    <div id="msg" data-i18n="raw13x.failed">解锁失败，请重启主机后重试</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="progressContainer" data-state="running">
        <div id="progressBar"></div>
        <div id="progressLabel"></div>
      </div>
      <div id="out"></div>
    </div>
    <script src="../pkg-stage.js"></script>
    <script src="./ui-bridge.js"></script>
    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
