<!DOCTYPE html>
<html manifest="900.manifest?rev=8" data-cache-total="30">
<head>
<meta name="ludora-host" content="1">
<script src="../i18n/zh-CN.js"></script>
<script src="../i18n/zh-TW.js"></script>
<script src="../i18n/en-US.js"></script>
<script src="../i18n.js"></script>
<title>Ludora · PS4 Browser Cache</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){if(e && e.total){Percent=Math.round(e.loaded / e.total * 100);window.msgs.innerHTML=LudoraI18n.t('cache.installing', {progress: Percent});document.getElementById('cache-progress').style.width=Percent+'%';document.getElementById('cache-progress').parentNode.classList.remove('indeterminate');}}
var cacheFinished=false;function DisplayCacheProgress(){if(cacheFinished)return;cacheFinished=true;document.getElementById('cache-progress').style.width='100%';document.getElementById('cache-progress').parentNode.classList.remove('indeterminate');window.msgs.innerHTML=LudoraI18n.t('cache.complete');setTimeout(function(){location.replace('index.html');},1200);}function PollCache(){if(window.applicationCache&&(window.applicationCache.status===window.applicationCache.IDLE||window.applicationCache.status===window.applicationCache.UPDATEREADY))DisplayCacheProgress();}setInterval(PollCache,500);
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML=LudoraI18n.t('cache.error');};
</script>
<h1 data-i18n="legacy.multiFirmwareTitle">鲁哆啦 Ludora · PS4 浏览器主机入口</h1>
<hr>
<br>
<h1 id=msgs data-i18n="cache.installingUnknown" style="font-size: 30px;margin-top: 77px;margin-bottom: 120px;">正在安装离线缓存…</h1>
<div class="cache-progress" aria-hidden="true"><span id="cache-progress"></span></div>
</body>
</html>
