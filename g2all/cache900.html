<!DOCTYPE html>
<html manifest="900.manifest">
<head>
<meta name="ludora-host" content="1">
<script src="../i18n/zh-CN.js"></script>
<script src="../i18n/zh-TW.js"></script>
<script src="../i18n/en-US.js"></script>
<script src="../i18n.js"></script>
<title>Ludora · PS4 Browser Cache</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){if(e && e.total){Percent=Math.round(e.loaded / e.total * 100);window.msgs.innerHTML=LudoraI18n.t('cache.installing', {progress: Percent});document.getElementById('cache-progress').style.width=Percent+'%';document.getElementById('cache-progress').parentNode.classList.remove('indeterminate');}else{window.msgs.innerHTML=LudoraI18n.t('cache.installingUnknown');document.getElementById('cache-progress').style.width='38%';document.getElementById('cache-progress').parentNode.classList.add('indeterminate');}}
function DisplayCacheProgress(){document.getElementById('cache-progress').style.width='100%';window.msgs.innerHTML=LudoraI18n.t('cache.complete');setTimeout(function(){window.msgs.innerHTML=LudoraI18n.t('cache.reopen');},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML=LudoraI18n.t('cache.error');};
</script>
<h1 data-i18n="legacy.multiFirmwareTitle">鲁哆啦 Ludora · PS4 浏览器主机入口</h1>
<hr>
<br>
<h1 id=msgs data-i18n="cache.installing" style="font-size: 30px;margin-top: 77px;margin-bottom: 120px;">正在安装离线缓存：0%</h1>
<div class="cache-progress" aria-hidden="true"><span id="cache-progress"></span></div>
</body>
</html>
