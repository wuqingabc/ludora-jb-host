<!DOCTYPE html>
<html manifest="700.manifest" data-cache-total="37">
<head>
<meta charset="utf-8">
<meta name="ludora-host" content="1">
<script src="../i18n/zh-CN.js"></script>
<script src="../i18n/zh-TW.js"></script>
<script src="../i18n/en-US.js"></script>
<script src="../i18n.js"></script>
<title>Ludora · PS4 Browser Cache</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){if(e && e.total){var Percent=Math.round(e.loaded / e.total * 100);window.LudoraUI.progress(Percent, LudoraI18n.t('cache.installing', {progress: Percent}), 'installing');}}
var cacheFinished=false;
function DisplayCacheProgress(){if(cacheFinished)return;cacheFinished=true;window.LudoraUI.progress(100, LudoraI18n.t('cache.complete'), 'done');setTimeout(function(){location.replace('index.html');},1200);}
function PollCache(){if(window.applicationCache&&(window.applicationCache.status===window.applicationCache.IDLE||window.applicationCache.status===window.applicationCache.UPDATEREADY))DisplayCacheProgress();}setInterval(PollCache,500);
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.LudoraUI.state(LudoraI18n.t('cache.error'), 'bad');};
</script>
<div id="brand"><span class="brand-mark">L</span><b data-i18n="brand.name">鲁哆啦 Ludora</b><span class="brand-kicker" data-i18n="host.title">主机工具</span></div>
<div id="wrap">
  <div class="eyebrow" data-i18n="host.title">主机工具</div>
  <div id="state" data-i18n="cache.installingUnknown">正在安装离线缓存…</div>
  <div id="det"></div>
  <div id="progressContainer" data-state="installing">
    <div id="progressBar"></div>
    <div id="progressLabel" data-i18n="cache.installingUnknown">正在安装离线缓存…</div>
  </div>
</div>
</body>
</html>
