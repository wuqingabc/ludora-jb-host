<script>
// 固件自动检测 + 路由:解析 PS4 User-Agent 得到固件号,直接跳转对应引擎入口。
// 非 PS4(桌面/PS5)或未覆盖固件则保留下方菜单作为兜底,不做任何跳转。
(function () {
  var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
  if (!m) return;
  var fw = parseInt(m[1], 10) * 100 + parseInt(m[2], 10);
  var target = null;
  if (fw === 505) target = "505goldhen/index.html";              // 5.05 GoldHEN
  else if (fw === 672) target = "672goldhen/index.html";         // 6.72 GoldHEN
  else if (fw >= 700 && fw <= 852) target = "g2all/index.html";  // 7.00–8.52(700 引擎)
  else if (fw >= 900 && fw <= 960) target = "g2all/index.html";  // 9.00–9.60(900 引擎)
  else if (fw >= 1000 && fw <= 1102) target = "g2all/index.html";// 10.00–11.02(css 引擎)
  else if (fw >= 1150 && fw <= 1202) target = "zrm/index.html";  // 11.50–12.02(lapse)
  else if (fw >= 1250 && fw <= 1300) target = "zrm/index.html";  // 12.50–13.00(poops)
  else if (fw >= 1302 && fw <= 1350) target = "13x/index.html";  // 13.02–13.50(内核表)
  else if (fw >= 1352 && fw <= 1402) target = "14x/index.html";  // 13.52–14.02(afterglow)
  if (target) window.location.replace(target);
})();
</script>
<div id="brand"><span class="brand-mark">L</span><b data-i18n="brand.name">鲁哆啦 Ludora</b><span class="brand-kicker" data-i18n="host.title">主机工具</span></div>
