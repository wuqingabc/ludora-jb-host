<!doctype html>
<html lang="zh-CN" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>鲁哆啦 Ludora · 解锁运行中</title>
    <!-- 运行页自带样式、只加载自己的模块，不再额外拉任何子资源；
         此 data: 空样式仅用于通过 check-host-pages 的「本地样式表」门禁。 -->
    <link rel="stylesheet" href="data:text/css," />
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. The landing page may use the
         shared stylesheet; this one may not. -->
    <style>
      :root {
        --bg: #0a0d1c;
        --panel: rgba(16, 21, 45, .72);
        --sunk: rgba(12, 16, 35, .86);
        --line: rgba(210, 220, 255, .12);
        --fg: #edf0fc;
        --bright: #edf0fc;
        --dim: #a4abcd;
        --faint: #8b93b8;
        --ok: #7fd0a0;
        --bad: #d08a7f;
        --warn: #d8c07f;
        --gold: #f3b942;
        --gold-strong: #f7c95c;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      body {
        width: calc(100% - 48px);
        max-width: 1180px;
        width: min(1180px, calc(100% - 48px));
        margin: 0 auto;
      }
      #brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 22px 4px 18px;
        border-bottom: 1px solid var(--line);
        background: transparent;
        text-align: left;
      }
      #brand b {
        color: var(--bright);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        background: linear-gradient(145deg, var(--gold-strong), #d99a1f);
        border-radius: 10px;
        color: var(--bg);
        font-size: 20px;
        font-weight: 800;
        box-shadow: 0 0 0 1px rgba(243, 185, 66, 0.35), 0 2px 10px rgba(243, 185, 66, 0.22);
      }
      .brand-kicker {
        margin-left: auto;
        color: var(--dim);
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      /* The live heap readout sits in the flow under the bar. Nothing here
         scrolls the document itself, so it stays in view without being
         positioned over the wordmark. */
      #ramBox {
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Running: a spinner under the bar. jb.js switches the body to .done,
         .fail or .log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
      #state,
      #out {
        display: none;
      }
      /* 下载进度条(与全站统一 #progressBar 同构,14x 自包含页内联,不新增子资源) */
      #progressContainer {
        position: relative;
        width: 100%;
        height: 3rem;
        margin: 22px 0 0;
        background: #1b2436;
        border: 1px solid #2c3e5a;
        border-radius: 12px;
        overflow: hidden;
      }
      #progressBar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2563eb 0%, #38bdf8 100%);
        transition: width 0.5s ease-in-out;
      }
      #progressLabel {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        z-index: 1;
        pointer-events: none;
      }
      #progressContainer[data-state="error"] #progressBar { background: #b91c1c; }
      #progressContainer[data-state="done"] #progressBar { background: #15803d; }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
      }
      /* ?log=1 -- the full step log. Laid out with flex rather than by
         subtracting a header height from 100vh. */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--sunk);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
      }
      /* The retry notice, raised by jb.js when the chain throws or stalls. */
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid #e66;
        background: #2a1414;
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand"><span class="brand-mark">L</span><b>鲁哆啦 Ludora</b><span class="brand-kicker">主机工具</span></div>
    <div id="ramBox">内存：检测中…</div>
    <div id="spin"></div>
    <div id="msg">请重启主机</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="progressContainer" data-state="running">
        <div id="progressBar"></div>
        <div id="progressLabel"></div>
      </div>
      <div id="out"></div>
    </div>
    <p class="byline">内核 afterglow · well0nez/m0zz</p>
    <script>
      // 14x 运行页自包含(不加载 ../i18n.js),这里内联一个与全站 window.LudoraUI 同构的
      // 最小壳,让 afterglow 的下载器字节进度能驱动同一套 #progressBar,而不新增任何子资源。
      (function () {
        function byId(id) { return document.getElementById(id); }
        function progress(pct, message, state) {
          var c = byId('progressContainer');
          if (!c) return null;
          var v = Math.max(0, Math.min(100, Number(pct) || 0));
          var bar = byId('progressBar');
          if (bar) bar.style.width = v + '%';
          var label = byId('progressLabel');
          if (label) label.textContent = message == null ? (Math.round(v) + '%') : String(message);
          if (state) c.setAttribute('data-state', state);
          return c;
        }
        function state(text, cls) {
          var n = byId('state');
          if (!n) return null;
          if (text != null) n.textContent = String(text);
          n.className = cls ? String(cls) : '';
          return n;
        }
        window.LudoraUI = { progress: progress, state: state };
      })();
    </script>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
