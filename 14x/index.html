<!doctype html>
<html lang="zh-CN" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>鲁哆啦 Ludora · 13.52 / 14.00 / 14.02 解锁</title>
    <script src="../i18n/zh-CN.js"></script>
    <script src="../i18n/zh-TW.js"></script>
    <script src="../i18n/en-US.js"></script>
    <script src="../i18n.js"></script>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <!-- 每次解锁都从本页进入：jb.js 的 referrer 守卫只在「从本页导航过来」时
         才武装内核链，避免浏览器恢复上次会话时无人值守地重跑。 -->
    <div id="brand"><span class="brand-mark">L</span><b data-i18n="brand.name">鲁哆啦 Ludora</b><span class="brand-kicker" data-i18n="host.title">主机工具</span></div>

    <div id="wrap">
      <div class="eyebrow" data-i18n="host.title">主机工具</div>
      <div id="state" data-i18n="afterglow.choosePayload">选择载荷</div>
      <div id="det" data-i18n="afterglow.lede">PS4 内核解锁 · 固件 13.52 / 14.00 / 14.02</div>
      <form class="pick" id="pick">
        <label class="choice-card">
          <input type="radio" name="payload" value="goldhen" checked />
          <span class="choice-name" data-i18n="afterglow.optionGoldhen">GoldHEN 2.4b18.14（默认）</span>
        </label>
        <label class="choice-card">
          <input type="radio" name="payload" value="hen" />
          <span class="choice-name" data-i18n="afterglow.optionHen">ps4-hen（实验）</span>
        </label>

        <label class="choice-card choice-auto">
          <input type="checkbox" id="auto" checked />
          <span class="choice-name" data-i18n="afterglow.autoStart">自动开始</span>
        </label>

        <button class="btn btn-primary" type="submit" data-i18n="afterglow.start">开始解锁</button>
        <p class="count" id="count"></p>
      </form>

      <p class="byline" data-i18n="afterglow.byline">内核 afterglow · well0nez/m0zz</p>
    </div>

    <script src="launch.js"></script>
  </body>
</html>
