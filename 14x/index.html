<!doctype html>
<html lang="zh-CN" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>鲁哆啦 Ludora · 14.00 越狱</title>
    <link rel="stylesheet" href="data:text/css," />
    <style>
      :root {
        --bg: #0b0d10; --panel: #0e1116; --line: #1e2732;
        --fg: #c8ced8; --bright: #e6ebf2; --dim: #7c8798;
        --gold: #f8c44f; --gold-strong: #e0a52a;
        --ok: #7fd0a0; --sans: "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg);
                   color: var(--fg); font: 15px/1.45 var(--sans); }
      #brand { padding: 10px 12px; border-bottom: 1px solid var(--line);
               background: var(--panel); text-align: center; }
      #brand b { color: var(--bright); font-size: 16px; font-weight: 700;
                 letter-spacing: .14em; }
      #brand .kicker { color: var(--dim); font-size: 12px; margin-left: 8px;
                       letter-spacing: .08em; }
      .shell { max-width: 520px; margin: 0 auto; padding: 22px 18px; }
      .lede { margin: 0 0 18px; color: var(--dim); font-size: 14px; text-align: center; }
      .panel { padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px;
               background: var(--panel); }
      .panel h1 { margin: 0 0 14px; font-size: 17px; color: var(--bright); }
      .opt { display: flex; align-items: center; gap: 10px; padding: 11px 12px;
             margin: 0 0 10px; border: 1px solid var(--line); border-radius: 6px;
             background: var(--bg); cursor: pointer; }
      .opt input { accent-color: var(--gold); width: 18px; height: 18px; }
      .opt span { color: var(--fg); }
      .opt:hover { border-color: var(--gold); }
      .opt-auto { border-style: dashed; }
      .btn { display: block; width: 100%; margin: 14px 0 0; padding: 12px;
             border: 0; border-radius: 6px; cursor: pointer;
             background: linear-gradient(180deg, var(--gold-strong), #c98b1e);
             color: #1a1405; font-size: 16px; font-weight: 700; letter-spacing: .1em; }
      .btn:active { transform: translateY(1px); }
      .count { margin: 12px 0 0; min-height: 18px; color: var(--gold);
               text-align: center; font-size: 14px; }
      .byline { text-align: center; color: var(--dim); font-size: 12px; margin-top: 18px; }
    </style>
  </head>
  <body>
    <!-- 每次越狱都从本页进入：jb.js 的 referrer 守卫只在「从本页导航过来」时
         才武装内核链，避免浏览器恢复上次会话时无人值守地重跑。 -->
    <div id="brand"><b>鲁哆啦 Ludora</b><span class="kicker">主机工具</span></div>

    <div class="shell">
      <main class="panel">
        <p class="lede">PS4 内核越狱 · 固件 13.52 / 14.00</p>
        <h1>选择载荷</h1>
        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN 2.4b18.13（默认）</span>
          </label>
          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>ps4-hen（实验）</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>自动开始</span>
          </label>

          <button class="btn" type="submit">开始越狱</button>
          <p class="count" id="count"></p>
        </form>
      </main>

      <p class="byline">内核 afterglow · well0nez/m0zz</p>
    </div>

    <script src="launch.js"></script>
  </body>
</html>
