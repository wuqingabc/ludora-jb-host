<!DOCTYPE html>
<html manifest="cache.manifest">
<head>

<script src="../i18n/zh-CN.js"></script>
<script src="../i18n/zh-TW.js"></script>
<script src="../i18n/en-US.js"></script>
<script src="../i18n.js"></script>
<title>PS4 9.00 FW Host v3.0 · Ludora | Automatic Exploitation</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));setTimeout(function(){window.msgs.innerHTML=LudoraI18n.t('cache.installing', {progress: Percent});},500)}
function DisplayCacheProgress(){setTimeout(function(){window.msgs.innerHTML=LudoraI18n.t('cache.complete');},1500);setTimeout(function(){window.msgs.innerHTML=LudoraI18n.t('cache.reopen');},3500);}if(window.applicationCache){if(window.applicationCache){window.applicationCache.addEventListener("progress",DLProgress,false);window.applicationCache.oncached=function(e){DisplayCacheProgress();};window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};}}
</script>
<h1>PS4 9.00 FW Host v3.0 · Ludora</h1>
<hr>
<br>
<h1 id="msgs" data-i18n="cache.installing" style="font-size: 30px;margin-top: 77px;margin-bottom: 120px;">正在安装离线缓存：0%</h1>
<div class="cache-progress" aria-hidden="true"><span id="cache-progress"></span></div>
</body>
</html>
