<!doctype html>
<html lang="zh-CN">
  <head>
<meta name="ludora-host" content="1">
<script src="../i18n/zh-CN.js"></script>
<script src="../i18n/zh-TW.js"></script>
<script src="../i18n/en-US.js"></script>
<script src="../i18n.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ludora · Authorize</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="site-header">
        <div class="brand">鲁哆啦 <span>Ludora</span></div>
        <div class="header-meta">手机授权</div>
      </header>
      <section class="panel compact">
        <p class="eyebrow">手机授权</p>
        <h1>输入授权码</h1>
        <p class="lede">输入主机屏幕上的 6 位授权码，确认后主机浏览器会自动继续。</p>
        <form data-form>
          <input class="auth-input" data-code inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
          <button type="submit">确认授权</button>
        </form>
        <p class="status"><span data-message>授权码仅对当前设备有效。</span></p>
      </section>
    </main>
    <script type="module" src="./src/authorize.mjs"></script>
  </body>
</html>
