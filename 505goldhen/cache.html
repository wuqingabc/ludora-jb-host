<!DOCTYPE html>
<html manifest="cache.manifest" data-cache-total="9">
<head>
<meta name="ludora-host" content="1">
<script src="../i18n/zh-CN.js"></script>
<script src="../i18n/zh-TW.js"></script>
<script src="../i18n/en-US.js"></script>
<script src="../i18n.js"></script>
<title>PS4 5.05 FW GoldHEN Ludora Host</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){if(e && e.total){Percent=Math.round(e.loaded / e.total * 100);window.msgs.innerHTML=LudoraI18n.t('cache.installing', {progress: Percent});}}
function DisplayCacheProgress(){window.msgs.innerHTML=LudoraI18n.t('cache.complete');setTimeout(function(){window.msgs.innerHTML=LudoraI18n.t('cache.reopen');},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML=LudoraI18n.t('cache.error');};
</script>
<h1>PS4 5.05 FW GoldHEN Ludora Host</h1>
<hr>
<br>
<h1 id=msgs data-i18n="cache.installing" style="font-size: 30px;margin-top: 77px;margin-bottom: 120px;">正在安装离线缓存：0%</h1>
</body>
</html>
